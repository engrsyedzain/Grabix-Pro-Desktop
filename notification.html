<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grabix Pro notifications</title>
    <style>
      /* The window is transparent; anything opaque here would show as a box
         around the cards. `overflow: hidden` keeps the slide-in animation from
         briefly forcing a scrollbar, which would be measured as extra height. */
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/notification.tsx"></script>
  </body>
</html>
